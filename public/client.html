<!-- public/client.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>学校祭ペンライト</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; text-align: center; background: #000; color: #fff; transition: background-color 0.2s ease; overflow: hidden; user-select: none; }
    .container { padding: 25px 20px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; justify-content: center; }
    h1 { font-size: 22px; margin-bottom: 10px; }
    .event-badge { display: inline-block; background: #00bcd4; color: black; font-weight: bold; padding: 4px 12px; border-radius: 12px; font-size: 13px; margin-bottom: 12px; }
    .step-box { background: #1a1a1a; border-radius: 12px; padding: 20px; border: 1px solid #333; }
    .class-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .class-btn { padding: 14px; font-size: 18px; font-weight: bold; border-radius: 8px; border: 2px solid #555; background: #2a2a2a; color: white; cursor: pointer; }
    .class-btn.selected { background: #00bcd4; border-color: #00bcd4; }
    .name-input { width: 90%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white; margin-top: 15px; box-sizing: border-box; }
    .start-btn { width: 100%; padding: 16px; font-size: 19px; font-weight: bold; border-radius: 10px; border: none; background: #ff007f; color: white; cursor: pointer; display: none; margin-top: 15px; }
    #joined-view { display: none; position: relative; height: 100%; }
    .info-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 20px 20px; box-sizing: border-box; transition: opacity 0.6s ease; pointer-events: none; }
    .info-overlay.hidden { opacity: 0; }
    .info-content { text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
    .ready-badge { display: inline-block; padding: 8px 18px; border-radius: 20px; background: rgba(0,0,0,0.6); color: #fff; font-size: 14px; border: 1px solid rgba(255,255,255,0.3); }
    .leave-btn { pointer-events: auto; margin: 0 auto 20px; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 20px; border: 1px solid rgba(255,255,255,0.5); background: rgba(0,0,0,0.6); color: #eee; cursor: pointer; }
    #browser-warning { display: none; background: #e63946; color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; font-weight: bold; }
    @keyframes rainbow { 0% { background-color: #ff0055; } 20% { background-color: #ff9900; } 40% { background-color: #ffe600; } 60% { background-color: #00ff66; } 80% { background-color: #00bfff; } 100% { background-color: #9900ff; } }
    .rainbow-mode { animation: rainbow 6s infinite alternate ease-in-out !important; }
  </style>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/show-engine.js"></script>
</head>
<body onclick="toggleInfoVisibility()">
  <video id="webcam" autoplay playsinline muted style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;"></video>

  <div class="container" id="setup-view">
    <div id="browser-warning">⚠️ LINE等のアプリ内で開いています！<br>右上の「︙」から「Chrome / Safariで開く」を選んでね！</div>
    
    <div>
      <span class="event-badge" id="eventBadge">🎪 メイン会場</span>
      <h1>🎉 学校祭ペンライト</h1>
    </div>

    <div class="step-box">
      <h3>① クラスを選んでね</h3>
      <div class="class-grid">
        <button class="class-btn" onclick="selectClass('1組', this)">1組</button>
        <button class="class-btn" onclick="selectClass('2組', this)">2組</button>
        <button class="class-btn" onclick="selectClass('3組', this)">3組</button>
        <button class="class-btn" onclick="selectClass('4組', this)">4組</button>
      </div>
      <h3 style="margin-top: 20px; margin-bottom: 5px;">② なまえ（空欄OK）</h3>
      <input type="text" id="nickname" class="name-input" placeholder="例：たろう">
      <button id="startBtn" class="start-btn" onclick="startCamera()">③ 画面＋ライトで参加（カメラ許可）</button>
      <button id="screenBtn" class="start-btn" style="background:#283e57" onclick="joinScreenOnly()">画面だけで参加（カメラ不要）</button>
    </div>
  </div>

  <div id="joined-view">
    <div class="info-overlay" id="infoOverlay">
      <div class="info-content">
        <span class="event-badge" id="eventBadgeJoined" style="background: rgba(0,0,0,0.6); color: #00bcd4; border: 1px solid #00bcd4;"></span>
        <h1 id="myClassTitle" style="font-size: 32px; margin: 8px 0 0;">1組</h1>
        <h2 id="myNameTitle" style="font-size: 20px; color: #ffb703; margin: 5px 0 15px;"></h2>
        <div class="ready-badge">✨ ステージに向けて掲げてね ✨</div>
        <p style="font-size: 11px; color: #aaa; margin-top: 8px;">（画面タップで表示/非表示）</p>
      </div>
      <div>
        <button class="leave-btn" onclick="leaveClass(event)">🔄 クラスを選び直す</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let track = null;
    let selectedClass = '';
    let isJoined = false;
    let infoTimer = null;
    let timelineTimeouts = [];
    let activeShow = null, clockOffset = 0, bestRTT = Infinity, latestTorch = false, torchBusy = false;
    let lastClockReply = Date.now();
    let strobeIntervalTimer = null; // ストロボ用タイマー

    // URLからイベントIDを取得（例: ?event=gym なら gym）
    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('event') || 'main';
    const eventName = urlParams.get('name') || (eventId === 'main' ? 'メイン会場' : eventId);
    document.getElementById('eventBadge').innerText = `🎪 ${eventName}`;
    document.getElementById('eventBadgeJoined').innerText = `🎪 ${eventName}`;

    async function keepScreenAlive() {
      try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
    }

    const ua = navigator.userAgent.toLowerCase();
    if (ua.indexOf('line') > -1 || ua.indexOf('instagram') > -1 || ua.indexOf('fbav') > -1) {
      document.getElementById('browser-warning').style.display = 'block';
    }

    function selectClass(className, btn) {
      selectedClass = className;
      document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('screenBtn').style.display = 'block';
    }

    async function findTorchCamera() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(d => d.kind === 'videoinput');
      for (const device of videoDevices) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: device.deviceId } } });
          const t = stream.getVideoTracks()[0];
          const caps = t.getCapabilities ? t.getCapabilities() : {};
          if (caps.torch) return { stream, track: t };
          t.stop();
        } catch (e) {}
      }
      const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
      return { stream: fallbackStream, track: fallbackStream.getVideoTracks()[0] };
    }

    function joinScreenOnly() {
      keepScreenAlive();
      isJoined = true;
      const name = document.getElementById('nickname').value;
      socket.emit('join-client', { eventId, group: selectedClass, name });
      document.getElementById('setup-view').style.display = 'none';
      document.getElementById('joined-view').style.display = 'block';
      document.getElementById('myClassTitle').innerText = `🏫 ${selectedClass}`;
      document.getElementById('myNameTitle').innerText = name ? `👤 ${name}` : '';
      document.getElementById('infoOverlay').classList.remove('hidden');
      scheduleHideInfo();
    }
    async function startCamera() {
      try {
        keepScreenAlive();
        if (!track) {
          const result = await findTorchCamera();
          track = result.track;
          latestTorch = true;
          setTorch(false);
          const video = document.getElementById('webcam');
          video.srcObject = result.stream;
          await video.play().catch(e => console.log(e));
        }

        isJoined = true;
        const name = document.getElementById('nickname').value;
        socket.emit('join-client', { eventId: eventId, group: selectedClass, name: name });

        document.getElementById('setup-view').style.display = 'none';
        document.getElementById('joined-view').style.display = 'block';
        document.getElementById('myClassTitle').innerText = `🏫 ${selectedClass}`;
        document.getElementById('myNameTitle').innerText = name ? `👤 ${name}` : '';

        scheduleHideInfo();
      } catch (err) {
        alert('ライト用カメラを利用できません。「画面だけで参加」から参加できます。');
      }
    }

    // 演出系タイマーをクリア
    function clearCurrentEffects() {
      if (strobeIntervalTimer) {
        clearInterval(strobeIntervalTimer);
        strobeIntervalTimer = null;
      }
    }

    function leaveClass(e) {
      if (e) e.stopPropagation();
      activeShow = null;
      clearTimeline();
      clearCurrentEffects();
      socket.emit('leave-client');
      isJoined = false;
      document.body.style.backgroundColor = '#000';
      document.body.classList.remove('rainbow-mode');
      setTorch(false);

      document.getElementById('joined-view').style.display = 'none';
      document.getElementById('setup-view').style.display = 'flex';
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('screenBtn').style.display = 'none';
      if (track) { track.stop(); track = null; }
      document.getElementById('webcam').srcObject = null;
      document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('selected'));
    }

    function toggleInfoVisibility() {
      if (!isJoined) return;
      const overlay = document.getElementById('infoOverlay');
      if (overlay.classList.contains('hidden')) {
        overlay.classList.remove('hidden');
        scheduleHideInfo();
      } else {
        overlay.classList.add('hidden');
      }
    }

    function scheduleHideInfo() {
      clearTimeout(infoTimer);
      infoTimer = setTimeout(() => {
        document.getElementById('infoOverlay').classList.add('hidden');
      }, 3500);
    }

    function syncClock() {
      if (!socket.connected) return;
      const before = Date.now();
      socket.timeout(2000).emit('clock-sync', {}, (err, serverTime) => {
        if (err) return;
        lastClockReply = Date.now();
        const rtt = Date.now() - before;
        if (rtt < bestRTT + 20) { bestRTT = Math.min(bestRTT, rtt); clockOffset = serverTime - (before + rtt / 2); }
      });
    }
    function blackout() {
      activeShow = null; clearTimeline(); clearCurrentEffects();
      applyColor({ color: '#000000' }); setTorch(false);
    }
    socket.on('show-state', data => {
      if (data.eventId !== eventId || !isJoined) return;
      clearTimeline(); clearCurrentEffects();
      activeShow = data.show;
      if (bestRTT === Infinity) clockOffset = data.serverTime - Date.now();
      if (!activeShow) { applyColor({ color: '#000000' }); setTorch(false); }
    });
    setInterval(() => {
      if (!activeShow || !isJoined) return;
      if (!socket.connected || Date.now() - lastClockReply > 30000) return blackout();
      const now = Date.now() + clockOffset;
      if (activeShow.playing && now < activeShow.startTime) { applyColor({ color: '#000000' }); setTorch(false); return; }
      const position = LightShow.position(activeShow, now);
      const state = LightShow.stateAt(activeShow.cues, position, selectedClass);
      document.body.classList.remove('rainbow-mode');
      document.body.style.backgroundColor = state.color;
      setTorch(state.torch);
    }, 40);
    setInterval(syncClock, 5000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && isJoined) { keepScreenAlive(); syncClock(); } });
    socket.on('disconnect', blackout);
    socket.on('connect', () => {
      bestRTT = Infinity; lastClockReply = Date.now(); syncClock();
      if (isJoined && selectedClass) {
        const name = document.getElementById('nickname').value;
        socket.emit('join-client', { eventId: eventId, group: selectedClass, name: name });
      }
    });

    socket.on('set-color', (data) => {
      clearTimeline();
      clearCurrentEffects();
      applyColor(data);
    });

    function applyColor(data) {
      document.body.classList.remove('rainbow-mode');
      if (data.mode === 'rainbow') {
        document.body.classList.add('rainbow-mode');
      } else {
        document.body.style.backgroundColor = data.color || '#000000';
      }
    }

    socket.on('start-timeline', (data) => {
      clearTimeline();
      clearCurrentEffects();
      const delay = Math.max(0, data.startTime - Date.now());
      data.timeline.forEach(step => {
        const timer = setTimeout(() => {
          if (step.type === 'color') applyColor({ color: step.value });
          if (step.type === 'rainbow') applyColor({ mode: 'rainbow' });
          if (step.type === 'torch') setTorch(step.value);
        }, delay + step.time);
        timelineTimeouts.push(timer);
      });
    });

    socket.on('stop-timeline', clearTimeline);

    function clearTimeline() {
      timelineTimeouts.forEach(t => clearTimeout(t));
      timelineTimeouts = [];
    }

    async function setTorch(state) {
      if (latestTorch === state && !torchBusy) return;
      latestTorch = state;
      if (torchBusy || !track) return;
      torchBusy = true;
      try {
        let applied;
        do {
          applied = latestTorch;
          await track.applyConstraints({ advanced: [{ torch: applied }] });
        } while (track && applied !== latestTorch);
      } catch (e) { /* Screen-only devices still receive all screen cues. */ }
      finally { torchBusy = false; }
    }

    // ストロボ命令を受信
    socket.on('strobe', (data) => {
      clearTimeline();
      clearCurrentEffects();

      const interval = data.interval || 100;
      let isOn = false;

      strobeIntervalTimer = setInterval(() => {
        isOn = !isOn;
        setTorch(isOn);
      }, interval);
    });

    // 演出停止通知を受信
    socket.on('stop-effects', () => {
      clearCurrentEffects();
    });

    socket.on('torch', (data) => {
      clearCurrentEffects();
      setTorch(data.state);
    });

    socket.on('pulse', (data) => {
      clearCurrentEffects();
      setTorch(true);
      setTimeout(() => setTorch(false), data.duration || 200);
    });
  </script>
</body>
</html>
